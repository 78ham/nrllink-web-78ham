services:
  web:
    image: 78ham/nrllink-web:latest
    build: .
    container_name: nrllink-web
    ports:
      - "80:80"
    depends_on:
      nrllink:
        condition: service_healthy
    restart: unless-stopped

  nrllink:
    image: 78ham/nrllink:latest
    build: ../nrllink-78ham
    container_name: nrllink-server
    ports:
      - "60050:60050/udp"
    volumes:
      - nrllink-data:/nrllink/data
      - ../nrllink-78ham/udphub.yaml:/nrllink/udphub/udphub.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/platform/info"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  nrllink-data:

