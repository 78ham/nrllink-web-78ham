# NRL Link 容器部署：前端容器 + 后端容器，同一编排、同一网络组
#
# 拓扑：
#   前端 web      80/tcp  → 对公网开放（页面入口，容器内 nginx 负责同源路由）
#   后端 nrllink  9000/tcp→ 默认只对本机/内网，不对公网开放（接口 / WebSocket）
#   后端 nrllink  60050/udp→ 对公网开放（设备语音 / 信令，必须直通，不能走 HTTP 反代）
#
#   ┌── 公网 ──┐        ┌─────────── 宿主机 ───────────┐
#   浏览器 ──> web:80 ──> nrllink:9000   （同一 Docker 网络组，容器名互访）
#   设备   ──> 60050/udp ─────┘
#
# 常用命令：
#   docker compose up -d            # 启动
#   ./update.sh                     # 更新前端 + 后端
#   docker compose logs -f web      # 前端日志
#   docker compose logs -f nrllink  # 后端日志（首次部署的管理员密码在这里）
#   docker compose down             # 停止（数据在 volume 中，不会丢失）
#
# 需要 HTTPS / 域名时，可以在宿主机再挂一层你自己的反向代理指向前端端口，
# 也可以直接把证书交给前端容器——按需选择，本项目不强制。
#
# 环境变量（写入同目录 .env 或 export，见 .env.example）：
#   NRL_IMAGE       后端镜像
#   NRL_WEB_IMAGE   前端镜像
#   WEB_BIND        前端监听地址，默认 0.0.0.0（对公网）
#   WEB_PORT        前端映射到宿主机的端口，默认 80
#   API_BIND        后端接口监听地址，默认 0.0.0.0（对局域网开放，须靠防火墙挡住公网）
#   API_PORT        后端接口映射到宿主机的端口，默认 9000
#   UDP_PORT        60050/udp 映射到宿主机的端口，默认 60050
#   TOKEN_KEY       JWT 签名密钥

services:
  # ---- 前端：对公网提供页面，容器内负责 /api、/ws、/uploads 的同源路由 ----
  web:
    image: ${NRL_WEB_IMAGE:-ghcr.io/78ham/nrllink-web:latest}
    build:
      context: .
      target: web
    container_name: nrllink-web
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-80}:80"
    depends_on:
      nrllink:
        condition: service_healthy
    networks:
      - nrllink-net
    restart: unless-stopped

  # ---- 后端：接口 / WebSocket / 上传图片，默认只对内网开放 ----
  nrllink:
    image: ${NRL_IMAGE:-ghcr.io/78ham/nrllink:latest}
    container_name: nrllink-server
    environment:
      NRL_DBFILE: /nrllink/data/udphub.sqlite3
      NRL_WEBPATH: /nrllink/www
      NRL_TOKEN_KEY: ${TOKEN_KEY:-}
    ports:
      - "${API_BIND:-0.0.0.0}:${API_PORT:-9000}:9000"
      - "${UDP_PORT:-60050}:60050/udp"
    volumes:
      - nrllink-data:/nrllink/data
      - nrllink-uploads:/nrllink/www/uploads
      # 可选：自定义平台名 / ICP / APRS / 微信 等配置时取消注释并准备 config/udphub.yaml
      # - ./config/udphub.yaml:/nrllink/conf/udphub.yaml:ro
    networks:
      - nrllink-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/platform/info"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  nrllink-net:
    name: nrllink-net
    driver: bridge

volumes:
  nrllink-data:    # SQLite 数据库
  nrllink-uploads: # 后台上传的图片等运行期文件