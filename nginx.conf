server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 内置 DNS，用于解析同一网络组里的后端服务名 nrllink
    resolver 127.0.0.11 valid=30s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ---- 同源路由：接口 / WebSocket / 上传图片交给同网络组的后端 ----
    # 覆盖前端实际使用的全部路径前缀，前缀有遗漏时补到这里即可
    location ~ ^/(api|user|device|group|platform|server|servers|relay|roles|room|billing|homepage|operatorlog|weixin|weixinreturn|notices|article|alipay|search|topn|transaction|routes)(/|$) {
        set $backend http://nrllink:9000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- WebSocket：实时语音监控，长连接 ----
    location ~ ^/ws(/|$) {
        set $backend http://nrllink:9000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering    off;
    }

    # ---- 后台上传的图片：由后端提供 ----
    location ^~ /uploads/ {
        set $backend http://nrllink:9000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- 前端静态资源：长缓存 ----
    location ~* \.(?:css|js|woff2?|ttf|eot|ico|png|jpe?g|gif|webp|svg|mp3|ogg|wav)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- 前端页面：hash 路由，兜底回 index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}