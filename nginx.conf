server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Gzip compression ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ---- Static assets: long cache ----
    location ~* \.(?:css|js|woff2?|ttf|eot|ico|png|jpe?g|gif|webp|svg|mp3|ogg|wav)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- Backend API: proxy pass ----
    location ~ ^/(user|platform|server|device|group|relay|billing|homepage|log|public|servers) {
        proxy_pass http://nrllink:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- WebSocket proxy ----
    location ~ ^/ws {
        proxy_pass http://nrllink:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ---- Fallback: Vue Router (hash mode) ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}