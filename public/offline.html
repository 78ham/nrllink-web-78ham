<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>网络连接断开 - HAM互联</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #14243b 0%, #080e18 100%);
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .offline-card {
      background: rgba(20, 35, 58, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(79, 140, 255, 0.2);
      border-radius: 20px;
      padding: 40px 28px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .offline-icon {
      width: 64px;
      height: 64px;
      margin-bottom: 20px;
      color: #ffaa33;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .retry-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 46px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }
    .retry-btn:active {
      transform: scale(0.98);
      background: #1e40af;
    }
    .status-pill {
      display: inline-block;
      margin-top: 18px;
      padding: 4px 12px;
      font-size: 12px;
      color: #64748b;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <svg class="offline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="1" y1="1" x2="23" y2="23"></line>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
      <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
      <line x1="12" y1="20" x2="12.01" y2="20"></line>
    </svg>
    <h1>当前处于离线状态</h1>
    <p>未能连接到 NRL 业余无线电互联网络服务器，请检查蜂窝移动网络或 Wi-Fi 连接。</p>
    <button class="retry-btn" onclick="retryConnection()">
      重新连接
    </button>
    <div class="status-pill" id="status-hint">网络恢复时将自动重连</div>
  </div>

  <script>
    function retryConnection() {
      const btn = document.querySelector('.retry-btn');
      btn.innerText = '正在重连...';
      fetch('/favicon.ico?_t=' + Date.now())
        .then(function() {
          window.location.reload();
        })
        .catch(function() {
          setTimeout(function() {
            btn.innerText = '重新连接';
          }, 800);
        });
    }

    window.addEventListener('online', function() {
      document.getElementById('status-hint').innerText = '网络已恢复，正在重载...';
      window.location.reload();
    });
  </script>
</body>
</html>
